name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t arabic-banking-intents-api .
      - name: Image size
        run: docker image inspect arabic-banking-intents-api --format '{{.Size}}' | numfmt --to=si --suffix=B
