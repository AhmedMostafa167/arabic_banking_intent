# TF-IDF + logistic regression baseline (scripts/train_baseline.py). Every value is logged as a run parameter.

[tfidf]
analyzer = "char_wb"  # character n-grams inside word boundaries: بطاقتي and البطاقة share "بطاق"
ngram_range = [2, 5]
min_df = 2
sublinear_tf = true

[logistic_regression]
C = 10.0
max_iter = 2000
