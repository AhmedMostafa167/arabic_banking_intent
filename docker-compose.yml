# The local stack: the MLflow tracking server and registry, the prediction API that loads @champion
# from it at startup, and the monitoring: Prometheus (localhost:9090), which scrapes the API and the
# machine, and Grafana (localhost:3000), with a model dashboard and a system dashboard.
#
#   docker compose up --build        # stop any MLflow server already running on the host first:
#                                    # one server at a time on the same mlflow.db
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2  # the version in uv.lock
    # The same registry the training scripts use. The whole project folder is mounted so SQLite's
    # journal file sits next to mlflow.db, as it does when the server runs on the host
    command: >
      mlflow server --backend-store-uri sqlite:////project/mlflow.db --artifacts-destination /project/mlartifacts
      --host 0.0.0.0 --port 5000 --workers 1
      --allowed-hosts mlflow:5000,localhost:5000,127.0.0.1:5000
    volumes:
      - .:/project
    user: "1000:1000"  # files it writes stay owned by the host user, so host-side scripts can still write
    environment:
      HOME: /tmp
      # Off: MLflow 3's background job workers (GenAI online scoring), which we don't use, start 7
      # extra processes of about 200 MB each
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      start_period: 180s  # failures while the server starts don't count
      interval: 10s
      timeout: 15s
      retries: 6

  api:
    build: .
    cpus: 3  # of the laptop's 4: the fourth runs the load generator during benchmarks
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000  # the service name: inside a container, localhost is the container
      MODEL_ALIAS: champion
      # ONNX models: threads per request. Measured 2026-11-02: the runtime's own choice (0) counts the
      # host's 4 cores, not this container's 3 CPUs, and latency collapsed (p50 3.7 s at 2 users); 1 thread
      # was best or tied up to 4 users, with the least CPU
      INFERENCE_THREADS: ${INFERENCE_THREADS:-1}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:  # the image's check, with more time: starting Python for it took over 5 s when memory was short
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      start_period: 300s
      interval: 10s
      timeout: 15s
      retries: 3
    depends_on:
      mlflow:
        condition: service_healthy  # start only once the registry answers

  prometheus:
    image: prom/prometheus:v2.45.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"

  node-exporter:  # the machine's CPU, memory, disk and network, for the system dashboard
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  grafana:
    image: grafana/grafana:11.6.0-ubuntu
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}  # set it in .env; never commit it
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # view the dashboards without logging in (bound to localhost only)
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      # Data source and dashboards come from these files at every start, so they are versioned with the code
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
